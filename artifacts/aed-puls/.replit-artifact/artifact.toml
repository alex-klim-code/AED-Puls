kind = "web"
previewPath = "/"
title = "AED Puls"
description = "Polska platforma standaryzacji i walidacji otwartych danych AED z publiczną mapą, zgłoszeniami oraz panelami dostawców i administratorów."
version = "1.0.0"
id = "artifacts/aed-puls"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24558

[services.development]
run = "pnpm --filter @workspace/aed-puls run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aed-puls", "run", "build" ]
serve = "static"
publicDir = "artifacts/aed-puls/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24558"
BASE_PATH = "/"
