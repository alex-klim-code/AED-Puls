        isDemo: { type: boolean }
    Source:
      type: object
      required: [id, name, url, license, coverage, institution, datasetId, updateFrequency, authoritativeScope, status, statusMessage]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        license: { type: string }
        coverage: { type: string }
        institution: { type: string }
        datasetId: { type: string }
        updateFrequency: { type: string }
        authoritativeScope: { type: string }
        status: { type: string }
        statusMessage: { type: string }
        lastCheckedAt: { type: [string, "null"] }
    ExportFieldOrigin:
      type: object
      required: [publicationId, fields, license]
      properties:
        publicationId: { type: string }
        fields: { type: array, items: { type: string } }
        license: { type: string }
    ExportDecision:
      type: object
      required: [aedId, decision, reasons, licenses, publicationIds, relationship]
      properties:
        aedId: { type: string }
        decision: { type: string, enum: [EXPORTED, SKIPPED, MANUAL_REVIEW] }
        reasons: { type: array, items: { type: string } }
        licenses: { type: array, items: { type: string } }
        publicationIds: { type: array, items: { type: string } }
        relationship: { type: string, enum: [SINGLE_SOURCE, SEPARATE_PUBLICATIONS, REPUBLICATION, DERIVED_OR_UNRESOLVED] }
        publicationChecks:
          type: array
          items:
            type: object
            required: [publicationId, license, verified, reason]
            properties:
              publicationId: { type: string }
              license: { type: string }
              verified: { type: boolean }
              reason: { type: string }
              evidenceUrl: { type: string }
              evidenceSha256: { type: string }
    SourceDirectoryEntry:
      allOf:
        - $ref: "#/components/schemas/Source"
        - type: object
          required: [section, endpoints, memberSources, groupingEvidence]
          properties:
            section: { type: string, enum: [aed, catalogue, auxiliary] }
            endpoints: { type: array, items: { type: string } }
            memberSources: { type: array, items: { $ref: "#/components/schemas/Source" } }
            groupingEvidence: { type: array, items: { type: string } }
    Activity:
      type: object
      required: [id, action, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        createdAt: { type: string }
    Workspace:
      type: object
      required: [records, ownRecords, activity, role]
      properties:
        records: { type: array, items: { $ref: "#/components/schemas/Aed" } }
        ownRecords: { type: array, items: { $ref: "#/components/schemas/Aed" } }
        activity: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        role: { type: string }
    McodIntegrationStatus:
      type: object
      required: [baseUrl, enabled, secretConfigured, connectionStatus, contractStatus, writesEnabled, automaticSyncEnabled]
      properties:
        baseUrl: { type: string }
        enabled: { type: boolean }
        secretConfigured: { type: boolean }
        connectionStatus: { type: string, enum: [NOT_CHECKED] }
        contractStatus: { type: string, enum: [NOT_VERIFIED] }
        writesEnabled: { type: boolean }
        automaticSyncEnabled: { type: boolean }
        syncEnabled: { type: boolean }
    McodEntity:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string }
        status: { type: string }
        title: { type: string }
        name: { type: string }
        organizationId: { type: string }
    McodWorkspace:
      type: object
      required: [status, message, organization, institutionRequests, datasets, resources, plans, drafts, records, events, syncRuns, unconfirmedOperations]
      properties:
        status: { $ref: "#/components/schemas/McodIntegrationStatus" }
        message: { type: string }
        organization:
          oneOf:
            - { $ref: "#/components/schemas/McodEntity" }
            - { type: "null" }
        institutionRequests: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        datasets: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        resources: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        plans: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        drafts: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        records: { type: array, items: { $ref: "#/components/schemas/Aed" } }
        recordStates: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        events: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        syncRuns: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        unconfirmedOperations: { type: array, items: { type: string } }
    McodInstitutionPage:
      type: object
      required: [items, total, page, pageSize, activationRequired]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/McodEntity" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        activationRequired: { type: boolean }
    McodActionResult:
      type: object
      required: [count, message]
      properties:
        count: { type: integer }
        message: { type: string }
    McodInstitutionApplication:
      type: object
      required: [kind, representativeName, representativeRole, representativeEmail]
      properties:
        kind: { type: string, enum: [EXISTING, NEW] }
        organizationName: { type: string, maxLength: 500 }
        institutionId: { type: string, maxLength: 200 }
        representativeName: { type: string, minLength: 2, maxLength: 300 }
        representativeRole: { type: string, minLength: 2, maxLength: 300 }
        representativeEmail: { type: string, format: email }
        details: { $ref: "#/components/schemas/McodInstitutionDetails" }
    McodInstitutionDetails:
      type: object
      properties:
        fullName: { type: string, maxLength: 500 }
        shortName: { type: string, maxLength: 100 }
        institutionType: { type: string, maxLength: 100 }
        address: { type: string, maxLength: 1000 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        website: { type: string, maxLength: 1000 }
        additionalFields:
          type: object
          additionalProperties: { type: string }
    McodInstitutionReview:
      type: object
      required: [decision, expectedRevision, note, representativeVerified]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        expectedRevision: { type: integer, minimum: 1 }
        note: { type: string, minLength: 5, maxLength: 4000 }
        representativeVerified: { type: boolean }
    McodDatasetDraft:
      type: object
      required: [institutionRequestId, title]
      properties:
        institutionRequestId: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 500 }
        description: { type: string, maxLength: 10000, default: "" }
    McodPublicationDraft:
      type: object
      required: [datasetId, format]
      properties:
        datasetId: { type: string, format: uuid }
        format: { type: string, enum: [csv, geojson] }
    McodAedDraftInput:
      type: object
      required: [payload]
      properties:
        targetAedId: { type: string, format: uuid }
        payload:
          type: object
          additionalProperties: true
        expectedRevision: { type: integer, minimum: 1 }
    McodDraftSubmission:
      type: object
      required: [expectedRevision, publicationConsent]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        publicationConsent: { type: boolean }
    McodContractOperation:
      type: object
      required: [path, method, operationId, summary]
      properties:
        path: { type: string }
        method: { type: string }
        operationId: { type: [string, "null"] }
        summary: { type: [string, "null"] }
    McodContractInspection:
      type: object
      required: [openapiVersion, operations, permissionsVerified, writesEnabled]
      properties:
        openapiVersion: { type: string }
        operations:
          type: array
          items: { $ref: "#/components/schemas/McodContractOperation" }
        permissionsVerified: { type: boolean }
        writesEnabled: { type: boolean }
