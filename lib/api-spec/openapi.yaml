openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AED Puls — fundament platformy otwartych danych AED. Dane demo nie są danymi ratunkowymi.
servers:
  - url: /api
paths:
  /open-data/harvest.md5:
    get:
      operationId: getHarvestMd5
      summary: Publiczna suma MD5 dokumentu XML harvestera MCOD
      responses:
        "200":
          description: MD5 dokładnych bajtów UTF-8 harvest.xml, bez logowania
          content:
            text/plain:
              schema: { type: string, minLength: 32, maxLength: 32, pattern: "^[a-f0-9]{32}$" }
  /open-data/harvest.xml:
    get:
      operationId: getHarvestXml
      summary: Publiczny katalog XML dla harvestera MCOD
      description: Jeden zbiór i zasób istniejącego eksportu CSV. Schemat urn:otwarte-dane:harvester:1.13 z oficjalnego otwarte_dane_latest.xsd; bez wspólnego przelicencjonowania danych.
      responses:
        "200":
          description: Metadane dopuszczonych do publicznego eksportu AED; bez wymagania logowania
          content:
            application/xml:
              schema: { type: string }
  /provider/red-map/status:
    get:
      operationId: getRedMapStatus
      responses:
        "200":
          description: Dostępność obliczania zasięgu pieszego dla organizacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedMapStatus" }
  /provider/red-map/analysis:
    post:
      operationId: analyseRedMap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedMapAreaInput" }
      responses:
        "200":
          description: Pokrycie wybranego obszaru według tras pieszych, bez domniemywania brakujących wyników
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedMapAnalysis" }
  /data-catalogue:
    get:
      operationId: getDataCatalogue
      responses:
        "200":
          description: Publiczny wykaz rzeczywistych zbiorów oraz prezentacja istniejącego standardu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataCatalogue" }
  /mcod/workspace:
    get:
      operationId: getMcodWorkspace
      responses:
        "200":
          description: Lokalny panel integracji bez połączenia z MCOD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodWorkspace" }
  /mcod/institutions:
    get:
      operationId: listMcodInstitutions
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Lokalna pamięć rzeczywiście pobranych instytucji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodInstitutionPage" }
  /admin/mcod/institutions/refresh:
    post:
      operationId: refreshMcodInstitutions
      responses:
        "200":
          description: Odświeżono pamięć instytucji po aktywacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodActionResult" }
  /mcod/institution-requests:
    post:
      operationId: submitMcodInstitutionRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodInstitutionApplication" }
      responses:
        "201":
          description: Zapisano lokalny wniosek do weryfikacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /admin/mcod/institution-requests/{id}/review:
    post:
      operationId: reviewMcodInstitutionRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodInstitutionReview" }
      responses:
        "200":
          description: Zweryfikowano reprezentanta lokalnie, bez tworzenia instytucji w MCOD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /admin/mcod/institution-requests/{id}/execute:
    post:
      operationId: executeMcodInstitutionRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: MCOD potwierdził rzeczywiste powiązanie lub utworzenie instytucji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /mcod/datasets:
    post:
      operationId: prepareMcodDataset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodDatasetDraft" }
      responses:
        "201":
          description: Zapisano lokalny projekt zbioru
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /mcod/publications:
    post:
      operationId: prepareMcodPublication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodPublicationDraft" }
      responses:
        "201":
          description: Zapisano niezmienny plan publikacji i raport walidacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /mcod/publications/{id}/download:
    get:
      operationId: downloadMcodPublication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Plik wygenerowany lokalnie z utrwalonego planu
          content:
            text/csv:
              schema: { type: string }
            application/geo+json:
              schema: { type: string }
  /mcod/publications/{id}/execute:
    post:
      operationId: executeMcodPublication
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Publikacja potwierdzona przez MCOD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /mcod/aed-drafts:
    post:
      operationId: saveMcodAedDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodAedDraftInput" }
      responses:
        "201":
          description: Zapisano lokalny szkic AED, bez publikacji na mapie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /mcod/aed-drafts/{id}:
    put:
      operationId: updateMcodAedDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodAedDraftInput" }
      responses:
        "200":
          description: Zaktualizowano szkic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /mcod/aed-drafts/{id}/submit:
    post:
      operationId: submitMcodAedDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/McodDraftSubmission" }
      responses:
        "200":
          description: Przekazano istniejącemu systemowi moderacji AED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /admin/mcod/sync:
    post:
      operationId: syncMcodAeds
      responses:
        "200":
          description: Wynik ręcznie uruchomionej synchronizacji po aktywacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodEntity" }
  /admin/mcod/status:
    get:
      operationId: getMcodIntegrationStatus
      description: Lokalny stan konfiguracji. Nie wykonuje żadnego połączenia z MCOD.
      responses:
        "200":
          description: Konfiguracja integracji (tylko ADMIN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodIntegrationStatus" }
        "401":
          description: Wymagane logowanie
        "403":
          description: Wymagana rola ADMIN
  /admin/mcod/contract:
    post:
      operationId: inspectMcodContract
      description: Ręczny odczyt OpenAPI, dostępny dopiero po włączeniu integracji. Bez zapisu do MCOD.
      responses:
        "200":
          description: Operacje zadeklarowane w pobranej specyfikacji, bez potwierdzenia uprawnień do ich wykonania
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McodContractInspection" }
        "401":
          description: Wymagane logowanie
        "403":
          description: Wymagana rola ADMIN lub poprawna ochrona CSRF
        "503":
          description: Integracja wyłączona lub brak konfiguracji
        "502":
          description: Nie udało się odczytać lub zweryfikować specyfikacji
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Sesja i konfiguracja
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/demo:
    post:
      operationId: demoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoInput" }
      responses:
        "200":
          description: Sesja
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Wylogowano
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /map-points:
    get:
      operationId: listMapPoints
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: accessibility, in: query, schema: { type: string } }
        - { name: verificationStatus, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20000 } }
      responses:
        "200":
          description: Lekkie punkty centralnego rejestru bez pełnych opisów i dokumentów źródłowych
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MapPoint" } }
  /admin/records:
    get:
      operationId: listAdminRecords
      parameters:
        - { name: missingLocation, in: query, schema: { type: boolean, default: false } }
        - { name: needsLocationReview, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Wszystkie rekordy administratora, także niekompletne i bez lokalizacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecordPage" }
  /admin/aeds/{id}:
    patch:
      operationId: updateAdminRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRecordUpdateInput" }
      responses:
        "200":
          description: Uzupełniony rekord; zmiana nie zatwierdza urządzenia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aed" }
  /admin/aeds/{id}/history:
    get:
      operationId: getAdminRecordHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Historia uzupełnień i decyzji, bez usuwania oryginałów źródłowych
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AedEditEvent" } }
  /aeds:
    get:
      operationId: listAeds
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: accessibility, in: query, schema: { type: string } }
        - { name: verificationStatus, in: query, schema: { type: string } }
        - { name: demo, in: query, schema: { type: boolean } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20000 } }
      responses:
        "200":
          description: Zatwierdzone AED
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Aed" } }
    post:
      operationId: submitAed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AedProposalInput" }
      responses:
        "201":
          description: Zgłoszenie przyjęte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AedProposal" }
  /aed-proposals:
    get:
      operationId: listAedProposals
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Zgłoszenia widoczne w ramach uprawnień konta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AedProposalPage" }
  /aed-proposals/{id}:
    put:
      operationId: resubmitAedProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalResubmission" }
      responses:
        "200":
          description: Uzupełniono zgłoszenie i skierowano ponownie do weryfikacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AedProposal" }
    get:
      operationId: getAedProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Szczegóły i historia zgłoszenia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AedProposal" }
  /admin/aed-proposals/{id}/review:
    post:
      operationId: reviewAedProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AedProposalDecision" }
      responses:
        "200":
          description: Decyzja i ewentualnie nowy rekord AED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AedProposal" }
  /admin/aed-proposals/{id}/duplicates:
    get:
      operationId: findProposalDuplicates
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Możliwe duplikaty do ręcznej oceny
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Aed" } }
  /submission-threads/{kind}/{id}:
    get:
      operationId: getSubmissionThread
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [AED, ERROR] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Prywatna rozmowa i historia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionThread" }
    post:
      operationId: addSubmissionComment
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [AED, ERROR] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionCommentInput" }
      responses:
        "201":
          description: Dodano komentarz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionComment" }
  /submission-photos/uploads:
    post:
      operationId: requestSubmissionPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionPhotoInput" }
      responses:
        "201":
          description: Prywatny jednorazowy obszar przesyłania
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionPhotoUpload" }
  /submission-photos/{id}/complete:
    post:
      operationId: completeSubmissionPhoto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zdjęcie zweryfikowane i oczyszczone z metadanych
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionPhoto" }
  /submission-photos/{id}:
    get:
      operationId: getSubmissionPhoto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zdjęcie dostępne wyłącznie uprawnionym osobom
          content:
            image/webp:
              schema: { type: string, format: binary }
  /aed-proposals/template.xlsx:
    get:
      operationId: downloadAedProposalTemplate
      responses:
        "200":
          description: Pusty wzór XLSX wraz z instrukcją
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /aed-proposals/import:
    post:
      operationId: importAedProposals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AedProposalFile" }
      responses:
        "201":
          description: Wiersze zapisano wyłącznie w kolejce administratora
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AedProposalImportResult" }
  /conflict-reports:
    get:
      operationId: listConflictReports
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Zgłoszenia błędów w zakresie uprawnień konta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictReportPage" }
  /conflict-reports/{id}:
    get:
      operationId: getConflictReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Błąd i powiązany rekord AED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictReport" }
  /admin/conflict-reports/{id}/review:
    post:
      operationId: reviewConflictReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConflictReportDecision" }
      responses:
        "200":
          description: Rozpatrzono błąd, bez automatycznej zmiany danych AED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConflictReport" }
  /submission-location:
    post:
      operationId: createSubmissionLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionLocationRequest" }
      responses:
        "200":
          description: Odczyt GPS z automatycznym adresem i krótkotrwałym potwierdzeniem dla zgłoszenia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionLocation" }
  /admin/integrations:
    get:
      operationId: getIntegrationPanel
      parameters:
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Źródła, importy i kontrola jakości
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationPanel" }
  /admin/sync:
    post:
      operationId: startSourceSync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncInput" }
      responses:
        "202":
          description: Synchronizacja uruchomiona
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStarted" }
  /admin/source-test:
    post:
      operationId: testSourceConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionTestInput" }
      responses:
        "200":
          description: Rzeczywista próba pobrania bez importowania AED
          content:
            application/json:
              schema:
                type: object
                required: [sourceId, status, message, checkedAt, recordCount]
                properties:
                  sourceId: { type: string }
                  status: { type: string }
                  message: { type: string }
                  checkedAt: { type: string }
                  recordCount: { type: integer }
  /admin/resolve-duplicate:
    post:
      operationId: resolveDuplicate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateDecision" }
      responses:
        "200":
          description: Zapisano decyzję
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/resolve-conflict:
    post:
      operationId: resolveDataConflict
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConflictDecision" }
      responses:
        "200":
          description: Zapisano decyzję
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /provenance:
    get:
      operationId: getAedProvenance
      parameters:
        - { name: aedId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pochodzenie publicznego rekordu
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Provenance" } }
  /nearby-aeds:
    get:
      operationId: getNearbyAeds
      description: Rzeczywiste wpisy OpenStreetMap w promieniu 5 km. Nie są potwierdzone przez AED Puls.
      parameters:
        - { name: latitude, in: query, required: true, schema: { type: number, minimum: -85, maximum: 85 } }
        - { name: longitude, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        "200":
          description: Dane społeczności OpenStreetMap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearbyAeds" }
        "503":
          description: Źródło danych chwilowo niedostępne
  /aeds/{id}:
    get:
      operationId: getAed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Szczegóły
          content:
            application/json:
