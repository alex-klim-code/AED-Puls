components:
  schemas:
    RedMapAreaInput:
      type: object
      required: [latitude, longitude, sizeKm]
      properties:
        latitude: { type: number, minimum: 49, maximum: 55 }
        longitude: { type: number, minimum: 14, maximum: 24.2 }
        sizeKm: { type: integer, enum: [2, 4, 6] }
    RedMapGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [MultiPolygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items: { type: number }
    RedMapStatus:
      type: object
      required: [configured, dailyRemaining, maxNewRequests, seconds]
      properties:
        configured: { type: boolean }
        dailyRemaining: { type: integer }
        maxNewRequests: { type: integer }
        seconds: { type: integer }
    RedMapPoint:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    RedMapAnalysis:
      type: object
      required: [complete, generatedAt, seconds, travelMode, area, covered, uncovered, unknown, aeds, candidateCount, analysedCount, newRequests, message, warnings]
      properties:
        complete: { type: boolean }
        generatedAt: { type: string }
        seconds: { type: integer }
        travelMode: { type: string, enum: [walk] }
        area: { $ref: "#/components/schemas/RedMapGeometry" }
        covered: { $ref: "#/components/schemas/RedMapGeometry" }
        uncovered: { $ref: "#/components/schemas/RedMapGeometry" }
        unknown: { $ref: "#/components/schemas/RedMapGeometry" }
        aeds: { type: array, items: { $ref: "#/components/schemas/RedMapPoint" } }
        candidateCount: { type: integer }
        analysedCount: { type: integer }
        newRequests: { type: integer }
        message: { type: string }
        warnings: { type: array, items: { type: string } }
    DataCatalogue:
      type: object
      required: [version, updatedAt, datasets, fields]
      properties:
        version: { type: string }
        updatedAt: { type: string }
        datasets: { type: array, items: { $ref: "#/components/schemas/DataCatalogueDataset" } }
        fields: { type: array, items: { $ref: "#/components/schemas/DataCatalogueField" } }
    DataCatalogueDataset:
      type: object
      required: [id, publisher, title, aggregation, formats, aedCount, updatedAt, licenses, averageQuality, statuses, url]
      properties:
        id: { type: string }
        publisher: { type: string }
        title: { type: string }
        aggregation: { type: boolean }
        formats: { type: array, items: { type: string } }
        aedCount: { type: integer }
        updatedAt: { type: [string, "null"] }
        licenses: { type: array, items: { type: string } }
        averageQuality: { type: [number, "null"] }
        statuses: { type: array, items: { type: string } }
        url: { type: [string, "null"] }
    DataCatalogueField:
      type: object
      required: [name, description, type, sourcePresence, enrichment]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string }
        sourcePresence: { type: string }
        enrichment: { type: string }
    GovernmentEntity:
      type: object
      required: [id, name, sourceUrl, metadata]
      properties:
        id: { type: string }
        name: { type: string }
        sourceUrl: { type: string }
        metadata: { type: object, additionalProperties: true }
        organizationId: { type: [string, "null"] }
        institutionId: { type: string }
        datasetId: { type: string }
        format: { type: string }
        importStatus: { type: string }
        importMessage: { type: string }
        importedCount: { type: integer }
        status: { type: string }
        representative: { type: string }
        evidence: { type: string }
        note: { type: string }
        userName: { type: string }
    GovernmentMemberships:
      type: object
      required: [claims, activeOrganizationId]
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/GovernmentEntity" } }
        activeOrganizationId: { type: [string, "null"] }
    GovernmentClaimInput:
      type: object
      required: [representative, evidence]
      properties:
        representative: { type: string, minLength: 2, maxLength: 200 }
        evidence: { type: string, minLength: 10, maxLength: 2000 }
    GovernmentClaimReview:
      type: object
      required: [note, representativeVerified]
      properties:
        note: { type: string, minLength: 8, maxLength: 2000 }
        representativeVerified: { type: boolean }
    SourceCategory:
      type: string
      enum: [OFFICIAL_GOV_PL, OFFICIAL_LOCAL_GOVERNMENT, COMMUNITY_OPEN_DATA, ORGANIZATION_SUBMISSION, USER_SUBMISSION, UNKNOWN]
    DeviceAssessment:
      type: object
      required: [aedId, recordVerificationStatus, operationalStatus, evidence]
      properties:
        aedId: { type: string, format: uuid }
        recordVerificationStatus: { type: string, enum: [VERIFIED_BY_OPERATOR, VERIFIED_BY_AUTHORIZED_REVIEWER, UNVERIFIED, DISPUTED] }
        operationalStatus: { type: string, enum: [OPERATIONAL, OUT_OF_SERVICE, UNKNOWN] }
        verifiedAt: { type: string, format: date-time }
        evidence: { type: string, minLength: 10, maxLength: 2000 }
        evidenceUrl: { type: string, maxLength: 1000 }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    DemoInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [USER, ORGANIZATIONS, PROVIDER, ADMIN], description: "ORGANIZATIONS wybiera konto organizacji; PROVIDER pozostaje zgodnym wstecznie aliasem tej samej roli." }
    Session:
      type: object
      required: [authenticated, demoEnabled, googleEnabled, csrfToken]
      properties:
        authenticated: { type: boolean }
        demoEnabled: { type: boolean }
        googleEnabled: { type: boolean }
        csrfToken: { type: string }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, name, role, isDemo]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [USER, PROVIDER, ADMIN] }
        isDemo: { type: boolean }
        organizationId: { type: [string, "null"] }
    ExportProvider:
      type: object
      required: [id, name, kind, status, recordCount, license]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [source, application, organization] }
        status: { type: string }
        recordCount: { type: integer }
        license: { type: string }
    ExportPreview:
      type: object
      required: [recordCount, publicationCount, providerIds, licenses, schemaVersion, fields, warnings, candidateRecordCount, skippedRecordCount, skippedPublicationCount, selectedLicenses, sources, reasons, policyVersion, legalDisclaimer, reportDownloadAvailable]
      properties:
        manualReviewCount: { type: integer }
        decisionSamples: { type: array, items: { $ref: "#/components/schemas/ExportDecision" } }
        candidateRecordCount: { type: integer }
        skippedRecordCount: { type: integer }
        skippedPublicationCount: { type: integer }
        selectedLicenses: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: "#/components/schemas/ExportSourceSummary" } }
        reasons: { type: array, items: { $ref: "#/components/schemas/ExportSkipSummary" } }
        policyVersion: { type: string }
        legalDisclaimer: { type: string }
        reportDownloadAvailable: { type: boolean }
        recordCount: { type: integer }
        publicationCount: { type: integer }
        providerIds: { type: array, items: { type: string } }
        licenses: { type: array, items: { type: string } }
        schemaVersion: { type: string }
        fields: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    ExportSourceSummary:
      type: object
      required: [id, name, license, recordCount, exportedRecordCount, skippedRecordCount]
      properties:
        id: { type: string }
        name: { type: string }
        license: { type: string }
        recordCount: { type: integer }
        exportedRecordCount: { type: integer }
        skippedRecordCount: { type: integer }
    ExportSkipSummary:
      type: object
      required: [code, message, recordCount, publicationCount]
      properties:
        code: { type: string }
        message: { type: string }
        recordCount: { type: integer }
        publicationCount: { type: integer }
    ExportAedFields:
      type: object
      required: [name, address, city, postalCode, voivodeship, country, latitude, longitude, completenessStatus, description, placement, accessibility, openingHours, deviceIdentifier, responsibleOrganization, sourceName, sourceUrl, license, sourceCategory, sourceOperationalClaim, qualityScore, qualityIssues]
      properties:
        completenessStatus: { type: string, enum: [COMPLETE, INCOMPLETE] }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        postalCode: { type: [string, "null"] }
        voivodeship: { type: [string, "null"] }
        country: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        description: { type: [string, "null"] }
        placement: { type: string }
        accessibility: { type: string }
        openingHours: { type: [string, "null"] }
        deviceIdentifier: { type: [string, "null"] }
        responsibleOrganization: { type: [string, "null"] }
        sourceName: { type: string }
        sourceUrl: { type: string }
        license: { type: string }
        sourceCategory: { type: string }
        sourceOperationalClaim: { type: [string, "null"], description: "Deklaracja źródła, a nie udokumentowana ocena fizycznego urządzenia" }
        qualityScore: { type: integer }
        qualityIssues: { type: array, items: { type: string } }
    ExportPublication:
      type: object
