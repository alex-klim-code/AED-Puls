        - { name: scope, in: query, schema: { type: string, enum: [public, approved, review], default: public } }
        - { name: providerIds, in: query, schema: { type: string } }
      responses:
        "200":
          description: Archiwum ZIP zawierające dane dopuszczone do eksportu i raport wszystkich pominięć
          content:
            application/zip:
              schema: { type: string, format: binary }
  /metadata:
    get:
      operationId: getDatasetMetadata
      parameters:
        - { name: licenses, in: query, schema: { type: string } }
        - { name: license, in: query, schema: { type: string, enum: [CC0-1.0, CC-BY-4.0, ODbL-1.0] }, description: Filtr oryginalnej licencji publikacji }
        - { name: demo, in: query, schema: { type: boolean, default: false } }
        - { name: scope, in: query, schema: { type: string, enum: [public, approved, review], default: approved } }
        - { name: providerIds, in: query, schema: { type: string } }
      responses:
        "200":
          description: Projekt metadanych, nie potwierdzenie zgodności urzędowej
