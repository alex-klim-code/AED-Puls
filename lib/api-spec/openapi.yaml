      parameters:
        - { name: licenses, in: query, schema: { type: string }, description: "Wiele licencji oddzielonych przecinkami. Nie łącz z license." }
        - { name: license, in: query, schema: { type: string, enum: [CC0-1.0, CC-BY-4.0, ODbL-1.0] }, description: "Opcjonalny filtr. Z providerIds lub scope=public brak filtra oznacza wszystkie znane licencje zachowane przy publikacjach. Stary URL bez tych parametrów domyślnie wybiera CC0-1.0." }
        - { name: scope, in: query, schema: { type: string, enum: [public, approved, review], default: approved } }
